id: CIS-6.1.1
title: Ensure sudo activity is logged to a dedicated log file
framework_mappings:
  cis_linux_v8: "6.1.1"
  nist_csf: "PR.PT-1"
  soc2: "CC7.2"
  cert_in_marker: "IMP"
severity: medium
category: access_control
description: >
  Verifies that sudo is configured to write its own log file recording each privilege
  escalation. sudo is the boundary between ordinary and administrative rights, and the
  record of who crossed it, when, and to run what is the primary evidence for attributing
  an administrative action to a person. Directing that record to a dedicated file rather
  than relying solely on the general auth log makes it easier to protect, forward and
  retain, and keeps it from being buried in unrelated authentication noise. The check
  also confirms the file exists and that its permissions do not expose it to
  unprivileged users.
applies_to: [linux_server]
test_logic:
  collector: sudo_config
  operator: all_of
  checks:
    - check: "logfile_configured"
      operator: equals
      expected: true
    - check: "logfile_exists"
      operator: equals
      expected: true
    - check: "logfile_mode"
      operator: mode_at_most
      expected: "640"
remediation: >
  Add a line such as 'Defaults logfile="/var/log/sudo.log"' to a new file under
  /etc/sudoers.d/, created with mode 440 and validated with "visudo -cf" before it is
  put in place; editing sudoers with a plain editor and introducing a syntax error can
  make sudo refuse to run at all and lock the host out of administration. Ensure the
  resulting log file is owned by root with mode 640 or stricter, and include it in the
  set of files shipped to the remote log collector so that a local attacker who gains
  root cannot erase the record of how they got there.
scored: true
